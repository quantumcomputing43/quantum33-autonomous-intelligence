name: Build Android Phone Agent

on:
  workflow_dispatch:
  push:
    paths:
      - 'phone_agent/**'
      - '.github/workflows/build-phone-agent.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Pre-build phone agent audit
        working-directory: phone_agent
        run: python3 audit_phone_agent.py
      - name: Build debug APK
        working-directory: phone_agent
        run: gradle assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: quantum33-autonomous-agent-debug-apk
          path: phone_agent/app/build/outputs/apk/debug/app-debug.apk
