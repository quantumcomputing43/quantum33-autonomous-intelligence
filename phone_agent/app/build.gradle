plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.chaquo.python'
}

android {
    namespace 'org.quantum33.autonomousagent'
    compileSdk 35

    defaultConfig {
        applicationId 'org.quantum33.autonomousagent'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '1.0.0-cyber'

        compileOptions {
            sourceCompatibility JavaVersion.VERSION_17
            targetCompatibility JavaVersion.VERSION_17
        }

        // RMX3690 compatibility: include both 64-bit and 32-bit ARM.
        // Python 3.11 supports both ABIs in Chaquopy.
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }
}

chaquopy {
    defaultConfig {
        version = '3.11'
        buildPython 'python3.11'
    }
}

kotlin {
    jvmToolchain(17)
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.activity:activity-ktx:1.10.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
}
